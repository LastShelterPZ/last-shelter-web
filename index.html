```
<title>Last Shelter | Project Zomboid</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;

        background:
            radial-gradient(circle at center, #303030 0%, #151515 45%, #080808 100%);

        color: #ffffff;
        font-family: Arial, Helvetica, sans-serif;
    }

    .container {
        width: 90%;
        max-width: 650px;
        padding: 45px 30px 50px;
        text-align: center;

        background: rgba(15, 15, 15, 0.92);
        border: 1px solid #444;
        border-radius: 14px;

        box-shadow: 0 15px 50px rgba(0, 0, 0, 0.7);
    }

    .logo {
        display: block;
        width: 150px;
        height: 150px;

        margin: 0 auto 25px;

        object-fit: contain;

        /* El PNG mantiene su transparencia */
        background: transparent;

        /* Resplandor alrededor del logo */
        filter:
            drop-shadow(0 0 8px rgba(255, 255, 255, 0.15))
            drop-shadow(0 8px 18px rgba(0, 0, 0, 0.6));

        /* Suaviza cualquier borde */
        border-radius: 50%;
    }

    h1 {
        margin: 0 0 10px;

        font-size: 48px;
        letter-spacing: 4px;
        text-transform: uppercase;
    }

    .subtitle {
        margin-bottom: 35px;
        color: #bdbdbd;
        font-size: 18px;
    }

    .status {
        margin-bottom: 30px;
        color: #9acd32;
        font-weight: bold;
    }

    .redirect {
        color: #888;
        font-size: 14px;
    }

    .redirect span {
        color: #ffffff;
        font-weight: bold;
    }

    .info {
        margin-top: 35px;
        color: #888;
        font-size: 14px;
        line-height: 1.7;
    }
</style>
```

</head>

<body>

```
<main class="container">

    <img
        class="logo"
        src="https://iili.io/nEEtX9t.png"
        alt="Last Shelter">

    <h1>LAST SHELTER</h1>

    <div class="subtitle">
        Project Zomboid B42
    </div>

    <div class="status">
        ● COMMUNITY ONLINE
    </div>

    <div class="redirect">
        Connecting to Discord in <span id="countdown">1</span>...
    </div>

    <div class="info">
        Factions · Survival · Events · PvE/PvP<br>
        Trae a tus amigos y formen su facción o lucha por sobrevivir.
    </div>

</main>

<script>
    let seconds = 1;

    const countdown = document.getElementById("countdown");

    const timer = setInterval(() => {
        seconds--;

        if (seconds <= 0) {
            clearInterval(timer);
            window.location.href = "/discord";
        } else {
            countdown.textContent = seconds;
        }
    }, 1000);
</script>
```

</body>
</html>
