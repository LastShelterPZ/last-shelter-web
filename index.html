<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Last Shelter | Project Zomboid</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;

            background:
                radial-gradient(circle at center, #303030 0%, #151515 45%, #080808 100%);

            color: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
        }

        .container {
            width: 90%;
            max-width: 650px;
            padding: 50px 30px;
            text-align: center;

            background: rgba(15, 15, 15, 0.92);
            border: 1px solid #444;
            border-radius: 14px;

            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.7);
        }

        h1 {
            margin: 0 0 10px;

            font-size: 48px;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        .subtitle {
            margin-bottom: 35px;
            color: #bdbdbd;
            font-size: 18px;
        }

        .status {
            margin-bottom: 30px;
            color: #9acd32;
            font-weight: bold;
        }

        .redirect {
            color: #888;
            font-size: 14px;
        }

        .redirect span {
            color: #ffffff;
            font-weight: bold;
        }

        .info {
            margin-top: 35px;
            color: #888;
            font-size: 14px;
            line-height: 1.7;
        }
    </style>
</head>

<body>

    <main class="container">

        <h1>LAST SHELTER</h1>

        <div class="subtitle">
            Project Zomboid B42
        </div>

        <div class="status">
            ● COMMUNITY ONLINE
        </div>

        <div class="redirect">
            Connecting to Discord in <span id="countdown">1</span>...
        </div>

        <div class="info">
            Factions · Survival · Events · PvE/PvP<br>
            Trae a tus amigos y formen su facción o lucha por sobrevivir.
        </div>

    </main>

    <script>
        let seconds = 1;

        const countdown = document.getElementById("countdown");

        const timer = setInterval(() => {
            seconds--;

            if (seconds <= 0) {
                clearInterval(timer);
                window.location.href = "/discord";
            } else {
                countdown.textContent = seconds;
            }
        }, 1000);
    </script>

</body>
</html>
